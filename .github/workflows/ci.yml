name: CI Pipeline

on:
  push:
    branches: [main, 'refactor-m*']
  pull_request:
    branches: [main, 'refactor-m*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.6.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @chaintelescope/shared build

      - name: Typecheck workspaces
        run: pnpm -r typecheck

      - name: Lint workspaces
        run: pnpm -r lint

  test-workspaces:
    name: Test API & Workspaces
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/chaintelescope_ci
      NODE_ENV: test
      ARGON2_PEPPER: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: chaintelescope_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.6.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration round-trip
        run: |
          pnpm build
          pnpm --filter @chaintelescope/api db:migrate
          pnpm --filter @chaintelescope/api db:migrate:down
          pnpm --filter @chaintelescope/api db:migrate

      - name: Run unit & integration tests
        run: pnpm test

  build:
    name: Build Monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.6.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm -r build

  python-legacy:
    name: Python (legacy app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Ruff lint
        run: ruff check app.py src pages tests

      - name: Ruff format check
        run: ruff format --check app.py src pages tests

      - name: Compile and entrypoint smoke check
        run: |
          python -m py_compile app.py
          python -c "import importlib; importlib.import_module('app')"

      - name: Unit and smoke tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-workspaces, build, python-legacy]
    steps:
      - name: Quality Gate Passed
        run: echo "All validation gates passed successfully."
